name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - name: smoke test the wheel
        shell: bash
        run: |
          uvx --from dist/*.whl cc-hub version
          uvx --from dist/*.whl cc-hub init "${RUNNER_TEMP}/hub" --no-git
          uvx --from dist/*.whl cc-hub --hub "${RUNNER_TEMP}/hub" doctor --json
