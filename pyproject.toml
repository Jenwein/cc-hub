[project]
name = "cc-hub"
dynamic = ["version"]
description = "A hub directory convention and CLI for coding agents launched by cc-connect"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jenwein" }]
keywords = ["cc-connect", "claude-code", "codex", "agent", "workspace"]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "tomli-w>=1.0",
  "charset-normalizer>=3",
  "psutil>=5.9",
]

[project.scripts]
cc-hub = "cc_hub.cli:main"

[project.urls]
Homepage = "https://github.com/Jenwein/cc-hub"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cc_hub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_hub"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP009", "B008"]
